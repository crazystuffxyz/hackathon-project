<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name=""viewport" content="width=device-width, initial-scale=1.0">
    <title>Template High School</title>

    <style>
        :root {
            --pine-deep: #244536;
            --pine: #3f654e;
            --paper: #f5f2e9;
            --paper-card: #fffdf7;
            --paper-tint: #eae6d9;
            --line: #d8d2c3;
            --muted: #77776b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: Georgia,serif;
            font-size: 25px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .back-link {
            font-size: 14px;
        }

        main {
            max-width: 1050px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .school-hero {
            background: var(--pine-deep);
            color: white;
            padding: 30px;
            border-radius: 6px;
            margin-bottom: 28px;
        }

        h1 {
            font-family: Georgia,serif;
            font-size: 2clamp(32px, 5vw, 48px);
            margin: 14px 0;
        }

        .school-hero p {
            color: #e0e6dc;
            margin: 8px 0;
            font-size: 1.1em;
        }

        .section {
            background: var(--paper-card);
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 26px;
            margin-bottom: 22px;
        }

        h2 {
            font-family: Georgia, serif;
            font-size: 25px;
            color: var(--pine-deep);
            margin: 0 0 16px;
        }

        .section p {
            line-height: 1.7;
            color: #55584e;
        }

        .empty-state {
            background: var(--paper);
            padding: 22px;
            border-radius: 4px;
            color: var(--muted);
            line-height: 1.6;
            border: 1px dashed var(--line);
        }

        .school-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .school-links a {
            color: var(--pine-deep);
            border: 1px solid var(--line);
            padding: 10px 15px;
            border-radius: 4px;
            text-decoration: none;
            background: var(--paper-card);
            font-weight: bold;
            transition: 0.2;
        }

        .school-links a:hover {
            background: var(--paper-tint);
        }

        .showcase-tabs {
            display: flex;
            border-bottom: 2px solid var(--line);
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            padding: 14px 16px;
            cursor: pointer;
            font-size: 16px;
            color: var(--muted);
            font-weight: 500;
            transition: 0.3s;
        }

        .tab-btn:hover {
            background-color: var(--paper-tint);
            color: var(--pine-deep);
        }

        .tab-btn.active {
            color: var(--pine-deep);
            font-weight: bold;
            border-bottom: 3px solid var(--pine);
            background-color: var(--paper);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4 ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .image-slider {
            position: relative;
            witdh: 100%;
            height: 350px;
            background: var(--line);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--line);
            margin-bottom: 20px;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide.active {
            display: block;
        }

        .slide-btn{
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(36, 69, 54, 0.8);
            color: white;
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 20px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .slide-btn.prev {left: 15px;}
        .slide-btn.next {right: 15px;}
        .slide-btn.hover { background: var(--pine); }

        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .info-card {
            background: var(--paper);
            padding: 20px;
            border-radius: 5px;
            border: 1px solid var(--line);
            border-left: 5px solid var(--pine);
        }

        .infocard h3 {
            margin-top: 0;
            color: var(--pine-deep);
            font-family: Georgia, serif;
            border-bottom: 1px solid var(--line);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .info-card ul {
            padding-left: 20px;
            margin: 0;
            color: #55584e;
            line-height: 1.8;
        }

        .map-placeholder {
            background: var(--paper-tint);
            padding: 40px;
            text-align: center;
            border-radius: 5px;
            border: 1px dashed var(--muted);
            color: var(--pine-deep);
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 600px){
            main {
                marin-top: 22px;
                padding: 0 14px;
            }
            .school-hero { padding: 26px; }
            .section { padding: 20px; }
            .grid-2-col {grid-template-columns: 1fr; }
        }
    </style>
</head>
