<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b2920">
    <meta name="description" content="Your Harvest profile: notes you've posted and the ones you've saved.">
    <title>Harvest — profile</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="profile">
    <header class="site-header">
        <div class="header-left">
            <a class="wordmark" href="/">
                <div class="seal-emblem" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8 6 4 11 4 16C4 19.3 6.7 22 10 22C11.5 22 12 21 12 21C12 21 12.5 22 14 22C17.3 22 20 19.3 20 16C20 11 16 6 12 2Z"/><path d="M12 7V17"/><path d="M9 11L12 14L15 11"/></svg>
                </div>
                <div class="wordmark-text">
                    <strong>harvest</strong>
                </div>
            </a>
        </div>

        <nav class="site-nav" aria-label="Main Navigation">
            <a href="/">Board</a>
            <a href="/messages.html">Messages</a>
            <a href="/gather.html">Checklist</a>
        </nav>

        <div class="header-actions">
            <button class="persona-switcher-btn" id="open-persona-switcher">
                <div class="profile-avatar" id="nav-avatar">Y</div>
                <div class="persona-meta">
                    <strong id="nav-display-name">You</strong>
                    <small id="nav-handle">@you</small>
                </div>
            </button>
            <button class="mobile-menu-trigger" id="mobile-menu-btn" aria-label="Toggle Navigation">
                <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
    </header>

    <div class="mobile-drawer" id="mobile-drawer">
        <a href="/">Board</a>
        <a href="/messages.html">Messages</a>
        <a href="/gather.html">Checklist</a>
        <a href="/profile.html">Your profile</a>
    </div>

    <main class="page-shell page-narrow">
        <section class="profile-card">
            <div class="large-avatar" id="profile-avatar">Y</div>
            <div class="profile-info">
                <p class="eyebrow" id="profile-location"></p>
                <h1 id="profile-name">Name</h1>
                <p id="profile-handle" style="font-family: var(--font-mono); font-size: 13px; color: var(--muted);">@you</p>
                <p id="profile-bio" style="font-family: var(--font-serif); font-size: 17px; margin-top: 10px; line-height: 1.5;"></p>
            </div>
            <button id="edit-profile" class="button button-quiet">Edit profile</button>
        </section>

        <section class="stats-grid">
            <div class="stat-cell">
                <strong id="profile-posts">0</strong>
                <span>Notes</span>
            </div>
            <div class="stat-cell">
                <strong id="profile-likes">0</strong>
                <span>Likes received</span>
            </div>
            <div class="stat-cell">
                <strong id="profile-saved">0</strong>
                <span>Saved</span>
            </div>
        </section>

        <div class="filter-bar" style="margin-bottom: 24px;">
            <button class="filter-btn active" id="tab-basket">Saved</button>
            <button class="filter-btn" id="tab-authored">Your notes</button>
        </div>

        <section id="profile-records-list" class="post-list"></section>

        <div id="profile-empty" class="aside-card hidden" style="text-align: center; padding: 48px 20px;">
            <h3 style="font-family: var(--font-serif); font-size: 26px; margin: 10px 0;">Nothing here yet.</h3>
            <p style="color: var(--muted); margin: 0 0 16px;">Save notes from the board, or write your own.</p>
            <a href="/" class="button button-quiet">Back to the board</a>
        </div>
    </main>

    <div class="modal-backdrop hidden" id="profile-backdrop">
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-edit-title">
            <button class="modal-close" id="close-profile" aria-label="Close dialog">×</button>
            <h2 id="profile-edit-title">Edit profile</h2>

            <form id="profile-form" style="display: grid; gap: 14px; margin-top: 16px;">
                <div>
                    <label class="field-label" for="display-name">Name</label>
                    <input class="field-input" id="display-name" maxlength="60" required>
                </div>
                <div>
                    <label class="field-label" for="bio">About you</label>
                    <textarea class="field-input" id="bio" maxlength="240" rows="3"></textarea>
                </div>
                <div>
                    <label class="field-label" for="location">Where you are</label>
                    <input class="field-input" id="location" maxlength="60" placeholder="e.g. Portland, ME">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px;">
                    <button type="button" class="button button-quiet" id="cancel-profile">Cancel</button>
                    <button class="button button-dark" type="submit">Save changes</button>
                </div>
            </form>
        </section>
    </div>

    <div class="modal-backdrop hidden" id="persona-backdrop">
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="persona-profile-title">
            <button class="modal-close" id="close-persona" aria-label="Close dialog">×</button>
            <h2 id="persona-profile-title">Switch account</h2>
            <div id="persona-list" class="persona-grid"></div>
        </section>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/turkey.js"></script>
    <script src="/js/leaves.js"></script>
    <script src="/js/sounds.js" defer></script>
</body>
</html>
